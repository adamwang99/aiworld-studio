name: build-tauri

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            rust_target: ""
          - os: windows-latest
            artifact: windows
            rust_target: ""
          - os: macos-latest
            artifact: macos-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            artifact: macos-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            npm run tauri:build -- --target ${{ matrix.rust_target }}
          else
            npm run tauri:build
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiworld-studio-tauri-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
          if-no-files-found: error
