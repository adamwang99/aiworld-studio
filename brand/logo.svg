<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main emblem gradient: indigo -> violet -> pink -->
    <linearGradient id="emblem" x1="220" y1="180" x2="820" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#9f8cff"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Cyan glow rim gradient -->
    <linearGradient id="rim" x1="180" y1="180" x2="860" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67ddff"/>
      <stop offset="0.55" stop-color="#9f8cff"/>
      <stop offset="1" stop-color="#ff8da1"/>
    </linearGradient>

    <!-- Subtle top sheen, contained near top vertex only -->
    <radialGradient id="sheen" cx="0.5" cy="0.30" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft outer aurora glow -->
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9f8cff" stop-opacity="0.50"/>
      <stop offset="0.62" stop-color="#67ddff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67ddff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Outer aurora halo (transparent bg preserved) -->
  <circle cx="512" cy="512" r="372" fill="url(#aura)" filter="url(#blurGlow)"/>

  <!-- Main glass emblem (rounded hexagon) -->
  <path d="M512 150 L824 329 L824 695 L512 874 L200 695 L200 329 Z"
        fill="url(#emblem)" stroke="url(#rim)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Even inner highlight stroke for glass edge (crisp, thin) -->
  <path d="M512 178 L800 343 L800 681 L512 846 L224 681 L224 343 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Contained top sheen (does not cut the icon in half) -->
  <path d="M512 150 L824 329 L824 695 L512 874 L200 695 L200 329 Z" fill="url(#sheen)"/>

  <!-- Orbit ring: full ellipse BEHIND bars (far side) -->
  <ellipse cx="512" cy="512" rx="232" ry="100" fill="none"
           stroke="#ffffff" stroke-width="26" opacity="0.40"
           transform="rotate(-22 512 512)"/>

  <!-- Audio waveform / sound bars (white, symmetric around x=512, peak centered) -->
  <g fill="#ffffff">
    <rect x="341" y="467" width="30" height="90"  rx="15"/>
    <rect x="393" y="437" width="30" height="150" rx="15"/>
    <rect x="445" y="400" width="30" height="224" rx="15"/>
    <rect x="497" y="356" width="30" height="312" rx="15"/>
    <rect x="549" y="400" width="30" height="224" rx="15"/>
    <rect x="601" y="437" width="30" height="150" rx="15"/>
    <rect x="653" y="467" width="30" height="90"  rx="15"/>
  </g>

  <!-- Orbit ring FRONT (near/bottom) arc OVER the bars for woven 3D depth -->
  <g transform="translate(512 512) rotate(-22)">
    <path d="M232 0 A232 100 0 0 1 -232 0" fill="none"
          stroke="#ffffff" stroke-width="26" opacity="0.92"/>
  </g>
</svg>
